name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.1"
      - name: Verify the dependency lockfile
        run: uv lock --check
      - name: Install lint dependencies
        run: uv sync --frozen --only-group lint
      - name: Lint and format with ruff
        run: |
          uv run --no-sync ruff format --check
          uv run --no-sync ruff check --output-format github

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.1"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Test (offline, synthetic Wikimedia responses) with coverage
        run: uv run --no-sync pytest --cov --cov-report=xml --junitxml=test-results.xml
      - name: Save test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
          retention-days: 14
          if-no-files-found: warn

  skill-launcher:
    # The way an agent runs the skill: `bash scripts/wi` from a clean checkout, runtime deps only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.1"
      - name: Run the launcher end to end (offline demo mode)
        env:
          WI_FAKE_API: "1"
        run: |
          out=$(bash scripts/wi analyze --topic "Intermittent fasting" --langs pl,cs --months 24 --pdf)
          echo "$out"
          echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'error' not in d, d; assert d['files']['pdf']"
